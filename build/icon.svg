<!-- Coax app icon (1024x1024)
     Matches the in-app empty-state brand mark: a dark navy rounded card
     with a subtle vertical gradient + top highlight + faint border, and
     the brand glyph (concentric rings — coax cable cross-section) in
     the blue→cyan brand gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Card background: subtle vertical gradient gives depth on light + dark wallpapers. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2238"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <!-- Top highlight: simulates the inset highlight on the in-app mark. -->
    <linearGradient id="hilite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Brand gradient: blue → cyan, matches the in-app glyph. -->
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Soft outer glow on the glyph for that "lit signal" feel. -->
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Apple's macOS template (Big Sur+) reserves the outer ~100px of the
       1024 canvas as transparent padding; the artwork sits in an 824×824
       safe area at (100,100). Without this padding, the icon visually
       bullies its dock neighbours. We wrap all visible content in a single
       transform so the design coords below stay readable (1024-space). -->
  <g transform="translate(100,100) scale(0.8046875)">
    <!-- Background card -->
    <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
    <!-- Top highlight -->
    <rect width="1024" height="1024" rx="224" fill="url(#hilite)"/>
    <!-- Hairline border -->
    <rect x="2" y="2" width="1020" height="1020" rx="222"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

    <!-- Coax glyph: heavy outer ring (cable jacket) + two thinner inner rings
         (dielectric, shield) + center conductor — the cross-section of a
         coaxial cable, all in brand gradient. -->
    <g filter="url(#glow)">
      <circle cx="512" cy="512" r="400" fill="none" stroke="url(#glyph)" stroke-width="104"/>
      <circle cx="512" cy="512" r="250" fill="none" stroke="url(#glyph)" stroke-width="32"/>
      <circle cx="512" cy="512" r="130" fill="none" stroke="url(#glyph)" stroke-width="28"/>
      <circle cx="512" cy="512" r="60"  fill="url(#glyph)"/>
    </g>
  </g>
</svg>
