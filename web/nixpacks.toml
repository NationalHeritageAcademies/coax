# Nixpacks build steps for the Coax marketing site.
# Pinning PHP 8.2 explicitly so Railway doesn't auto-bump us into a version
# the framework (melodicdev/framework, requires ^8.2) hasn't been tested on.

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --no-progress --optimize-autoloader"]

[variables]
APP_ENV = "pd"
